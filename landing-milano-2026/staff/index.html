<style>
:root{
  --navy:#1B1450; --navy-2:#241B63; --ink:#14122B; --gold:#EFC75E; --gold-dk:#C9A03C;
  --bg:#F4F4F8; --card:#fff; --bordo:#E2E1EC; --testo:#26243F; --tenue:#7C7898;
  --rosso:#D64545; --arancio:#E08A2E; --giallo:#D9C13A; --verde:#3E9E63; --grigio:#9B98AE;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--testo);font-size:15px;line-height:1.45}
button,input,select,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer}
.nascosto{display:none!important}

/* ---------- accesso ---------- */
#accesso{min-height:100vh;display:grid;place-items:center;background:var(--navy);padding:20px}
.box{background:var(--card);border-radius:14px;padding:36px 32px;width:100%;max-width:400px;
     box-shadow:0 20px 60px rgba(0,0,0,.35)}
.box h1{margin:0 0 4px;font-size:1.28rem}
.box p.sub{margin:0 0 22px;color:var(--tenue);font-size:.9rem}
.campo{width:100%;padding:11px 13px;border:1px solid var(--bordo);border-radius:9px;margin-bottom:12px;
       background:#fff;color:var(--testo)}
.campo:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:transparent}
#codice{letter-spacing:.5em;text-align:center;font-size:1.5rem;font-weight:700;padding:14px}
.btn{width:100%;padding:12px;border:0;border-radius:9px;background:var(--navy);color:#fff;font-weight:700}
.btn:hover{background:var(--navy-2)}
.btn:disabled{opacity:.5;cursor:default}
.btn.oro{background:var(--gold);color:var(--ink)}
.btn.oro:hover{background:var(--gold-dk)}
.btn.verde{background:#1FA855}
.btn.verde:hover{background:#188745}
.avviso{margin:12px 0 0;padding:10px 12px;border-radius:8px;font-size:.87rem}
.avviso.err{background:#FDECEC;color:#98292E;border:1px solid #F3C9C9}
.avviso.ok{background:#EAF6EF;color:#245F3D;border:1px solid #C6E5D3}
.link{background:none;border:0;color:var(--gold-dk);text-decoration:underline;padding:0;width:auto;font-size:.87rem}

/* ---------- struttura ---------- */
header{background:var(--navy);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:18px;
       flex-wrap:wrap;position:sticky;top:0;z-index:30}
header .marchio{font-weight:800;letter-spacing:.03em}
header .marchio span{color:var(--gold)}
.kpi{display:flex;gap:16px;flex-wrap:wrap;margin-left:auto;align-items:center}
.kpi div{text-align:center;min-width:62px}
.kpi b{display:block;font-size:1.12rem;line-height:1.1}
.kpi small{color:#B9B4D8;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em}
.chi{font-size:.82rem;color:#B9B4D8}
header select{padding:6px 9px;border:1px solid #4A4180;border-radius:7px;background:#2C2470;color:#fff;max-width:190px}
header select:focus{outline:2px solid var(--gold);outline-offset:1px}

.barra{background:#fff;border-bottom:1px solid var(--bordo);padding:10px 18px;display:flex;gap:8px;
       flex-wrap:wrap;align-items:center;position:sticky;top:52px;z-index:20}
.barra select,.barra input{padding:7px 10px;border:1px solid var(--bordo);border-radius:7px}
.barra input[type=search]{min-width:210px}
main{padding:16px 18px 60px}
.conteggio{color:var(--tenue);font-size:.85rem;margin:0 0 10px}

/* ---------- lista ---------- */
.riga{background:#fff;border:1px solid var(--bordo);border-left:5px solid var(--grigio);
      border-radius:10px;padding:11px 14px;margin-bottom:7px;display:flex;gap:14px;align-items:center;
      cursor:pointer}
.riga:hover{border-color:var(--gold);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.riga.u-scaduto{border-left-color:var(--rosso)}
.riga.u-oggi{border-left-color:var(--arancio)}
.riga.u-settimana{border-left-color:var(--giallo)}
.riga.u-chiuso{border-left-color:var(--verde)}
.riga .chi-nome{font-weight:700}
.riga .meta{color:var(--tenue);font-size:.84rem}
.riga .destra{margin-left:auto;text-align:right;font-size:.82rem;color:var(--tenue);white-space:nowrap}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.72rem;font-weight:700;
      background:#EFEEF6;color:#514D77;margin-left:6px;vertical-align:middle}
.pill.crm{background:#FFF3D6;color:#8A6410}
.pill.mio{background:#E4EDFB;color:#1F4A86}
.pill.libero{background:#F0EFF5;color:#7C7898}
.atti{font-size:1rem;letter-spacing:2px}

/* ---------- scheda ---------- */
.velo{position:fixed;inset:0;background:rgba(12,10,30,.55);display:grid;place-items:center;padding:16px;z-index:50}
.scheda{background:#fff;border-radius:14px;width:100%;max-width:860px;max-height:92vh;overflow:auto}
.scheda header{position:sticky;top:0;background:var(--navy);border-radius:14px 14px 0 0}
.corpo{padding:18px}
.recap{background:#F7F7FB;border:1px solid var(--bordo);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:.9rem}
.recap b{color:var(--ink)}
.griglia{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:.8rem;font-weight:700;color:var(--tenue);margin:0 0 4px;text-transform:uppercase;letter-spacing:.04em}
textarea{width:100%;min-height:92px;padding:10px;border:1px solid var(--bordo);border-radius:9px;resize:vertical}
.cronometro{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums}
.cronometro.allarme{color:var(--rosso)}
.azioni{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.azioni .btn{width:auto;padding:10px 16px}
.contatore{font-size:.78rem;color:var(--tenue);text-align:right}
.contatore.corto{color:var(--rosso);font-weight:700}

/* ---------- CTA e campo da portare a casa ---------- */
.tratti{font-size:1.02rem;font-weight:700;color:var(--navy);margin-bottom:6px}
.passi{margin:14px 0 0;padding:12px 14px;border:1px solid #DCE2EF;border-radius:10px;background:#FAFBFE}
.passi h4{margin:0 0 8px;font-size:.83rem;letter-spacing:.04em;text-transform:uppercase;color:var(--tenue)}
.passi ol{margin:0;padding-left:20px}
.passi li{margin-bottom:5px;line-height:1.35}
.passi li b{color:var(--navy)}
.passi li span{display:block;color:var(--tenue);font-size:.85rem}
.passi li.ramo b{color:#8A6A17}
.passi .apri{margin-top:10px}
.testo-script{max-height:70vh;overflow:auto;padding-right:6px}
.testo-script h3{margin:16px 0 8px;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;color:var(--tenue);border-bottom:1px solid #E4E8F2;padding-bottom:4px}
.testo-script .say{margin:0 0 8px;padding:9px 12px;border-left:3px solid var(--gold);background:#FFFCF3;border-radius:0 6px 6px 0}
.testo-script .nota{margin:0 0 8px;color:var(--tenue);font-size:.88rem}
.testo-script .bul{margin:0 0 5px 16px;font-size:.9rem}
.testo-script .obz{margin:0 0 10px}
.testo-script .obz b{display:block;color:var(--navy)}
.pill.cta-prof{background:#EDE7FB;color:#4B2E8A}
.pill.cta-forum{background:#E2F1E8;color:#22603F}
.pill.maturo{background:#FFF3D6;color:#8A6410}
.campo-chiave{border:2px solid var(--gold);border-radius:10px;padding:10px;background:#FFFCF3}
.campo-chiave label{color:var(--gold-dk)}
.campo-chiave .serve{font-size:.76rem;color:var(--gold-dk);margin-top:4px;font-weight:700}
.secondario{opacity:.62}

/* ---------- popup di composizione ---------- */
.composa{background:#fff;border-radius:14px;width:100%;max-width:640px;max-height:92vh;overflow:auto;
         box-shadow:0 24px 70px rgba(0,0,0,.4)}
.composa .corpo{padding:18px}
.composa textarea{min-height:210px;font-size:.92rem;line-height:1.5}
.composa .a-chi{font-size:.85rem;color:var(--tenue);margin:0 0 10px}
.nota-riga{font-size:.82rem;color:var(--tenue);margin:10px 0 0;padding:9px 11px;background:#F7F7FB;
           border:1px solid var(--bordo);border-radius:8px}
.nota-riga.attenzione{background:#FFF8E8;border-color:#F0DFB0;color:#7A5B12}
.nota-riga.blocco{background:#FDECEC;border-color:#F3C9C9;color:#98292E;font-weight:700}
@media(max-width:700px){.griglia{grid-template-columns:1fr}.kpi{width:100%;justify-content:space-between}}
</style>

<script>
/* ═══════════════ configurazione ═══════════════
   La chiave qui sotto e la chiave PUBBLICA (anon): e fatta per stare nel browser.
   Non apre nulla da sola — ogni dato passa dalla Edge Function, che verifica il
   token e controlla che chi chiama sia un operatore attivo della campagna.      */
const URL_SUPA = 'https://eywxidahsumzrlzwnfev.supabase.co';
const CHIAVE   = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5d3hpZGFoc3VtenJsenduZmV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExNzcyNzMsImV4cCI6MjA4Njc1MzI3M30.visQEcLDoCl3mEwDqRzFhUowOhipKJybH_HiVkIQv-I';
const API      = URL_SUPA + '/functions/v1/ricontatti-api';
const DEPOSITO = 'fc_ricontatti_sessione';

/* «Da NON chiamare» teneva insieme due cose diverse, e vanno trattate diverse:
   «Non interessato» è un lead chiuso e si archivia, «Richiede disiscrizione» è
   una richiesta di cancellazione e toglie la persona dalla lista per sempre. */
const ESITI = ['Da Contattare','Ci pensa','Viene','Non risponde','Richiamata','Ricontatto',
               'Promette Profilazione','Profilato - Call back','Non può venire','Acquistato',
               'Non interessato','Richiede disiscrizione','Altro operatore','Altro'];
const OBIEZIONI = ['non ho tempo','prezzo troppo alto','non è il mio target','distanza/logistica',
                   'deve decidere con socio','ha già partecipato senza concludere',
                   'non ricorda chi siamo','preferisce l\'online','non interessato','altro'];
/* esiti in cui la chiamata ha davvero ricevuto risposta: la nota diventa obbligatoria */
const CONNESSI = new Set(['Ci pensa','Viene','Ricontatto','Promette Profilazione',
                          'Profilato - Call back','Non può venire','Acquistato',
                          'Non interessato','Richiede disiscrizione','Altro operatore','Altro']);
/* esiti che dicono «ha risposto e l'abbiamo portata a casa»: da qui in poi il
   messaggio da mandare non è più quello di chi non risponde, è il recap. */
const ANDATA_BENE = new Set(['Ci pensa','Viene','Ricontatto','Promette Profilazione',
                             'Profilato - Call back']);
/* esiti che chiudono il contatto: dopo questi non si torna in coda.
   Sono gli stessi che il database calcola in chiamate.esito_terminale.       */
const TERMINALI = new Set(['Acquistato','Non interessato','Richiede disiscrizione',
                           'Non può venire','Altro operatore']);

let sessione = null, io = null, pagina = 0, ultimoTotale = 0, cronometro = null;
/* capacità delle linee WhatsApp: arriva col login e si aggiorna quando serve.
   Decide se il popup propone l'invio automatico o si apre già in manuale.    */
let capacitaOra = null;

/* ═══════════════ utilità ═══════════════ */
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dataOra = v => v ? new Date(v).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';

/* Copia negli appunti. Il metodo moderno vuole un contesto sicuro: la pagina sta
   su https, ma se per qualche motivo non lo fosse resta il ripiego con textarea,
   altrimenti l'operatrice si ritroverebbe con gli appunti vuoti e nessun segnale. */
function copiaNegliAppunti(testo){
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(testo).catch(() => copiaAllaVecchia(testo));
  }else{ copiaAllaVecchia(testo); }
}
function copiaAllaVecchia(testo){
  const a = document.createElement('textarea');
  a.value = testo; a.setAttribute('readonly',''); a.style.position='fixed'; a.style.top='-1000px';
  document.body.appendChild(a); a.select();
  try{ document.execCommand('copy'); }catch(e){ /* niente da fare, resta il testo a video */ }
  a.remove();
}

function avviso(dove, testo, tipo='err'){
  $(dove).innerHTML = testo ? `<p class="avviso ${tipo}">${esc(testo)}</p>` : '';
}

function salvaSessione(s){
  sessione = s;
  try{ localStorage.setItem(DEPOSITO, JSON.stringify(s)); }catch(e){}
}
function scordaSessione(){
  sessione = null; io = null;
  try{ localStorage.removeItem(DEPOSITO); }catch(e){}
}

/* ═══════════════ accesso con codice via email ═══════════════ */
async function chiediCodice(email){
  const r = await fetch(URL_SUPA + '/auth/v1/otp', {
    method:'POST',
    headers:{'apikey':CHIAVE,'Content-Type':'application/json'},
    /* create_user: chi e in ricontatti.operatori puo non avere ancora un account.
       Crearlo non da accesso a nulla: il cancello e la Edge Function.            */
    body: JSON.stringify({ email, create_user:true })
  });
  if(!r.ok){
    const d = await r.json().catch(()=>({}));
    throw new Error(d.msg || d.error_description || 'Non riesco a inviare il codice.');
  }
}

async function verificaCodice(email, token){
  const r = await fetch(URL_SUPA + '/auth/v1/verify', {
    method:'POST',
    headers:{'apikey':CHIAVE,'Content-Type':'application/json'},
    body: JSON.stringify({ email, token, type:'email' })
  });
  const d = await r.json().catch(()=>({}));
  if(!r.ok || !d.access_token) throw new Error(d.msg || d.error_description || 'Codice non valido o scaduto.');
  return d;
}

async function rinnova(){
  if(!sessione?.refresh_token) return false;
  const r = await fetch(URL_SUPA + '/auth/v1/token?grant_type=refresh_token', {
    method:'POST', headers:{'apikey':CHIAVE,'Content-Type':'application/json'},
    body: JSON.stringify({ refresh_token: sessione.refresh_token })
  });
  if(!r.ok) return false;
  const d = await r.json();
  if(!d.access_token) return false;
  salvaSessione(d);
  return true;
}

/* ═══════════════ chiamate all'API ═══════════════ */
async function api(percorso, opzioni = {}, secondoTentativo = false){
  const r = await fetch(API + percorso, {
    ...opzioni,
    headers:{
      'Authorization':'Bearer ' + (sessione?.access_token ?? ''),
      'apikey':CHIAVE,
      'Content-Type':'application/json',
      ...(opzioni.headers || {})
    }
  });
  if(r.status === 403 && !secondoTentativo){
    /* puo essere solo il token scaduto: si prova a rinnovarlo una volta sola */
    if(await rinnova()) return api(percorso, opzioni, true);
  }
  const d = await r.json().catch(()=>({}));
  if(!r.ok){
    if(r.status === 403 && secondoTentativo){ esci(); }
    throw new Error(d.errore || 'Errore imprevisto.');
  }
  return d;
}

/* ═══════════════ avvio ═══════════════ */
$('#chiedi').onclick = async () => {
  const email = $('#email').value.trim().toLowerCase();
  if(!email.includes('@')) return avviso('#avviso-accesso','Serve un indirizzo email valido.');
  $('#chiedi').disabled = true; avviso('#avviso-accesso','Invio il codice…','ok');
  try{
    await chiediCodice(email);
    $('#dove').textContent = email;
    $('#passo-email').classList.add('nascosto');
    $('#passo-codice').classList.remove('nascosto');
    avviso('#avviso-accesso','Controlla la posta. Il codice scade dopo pochi minuti.','ok');
    $('#codice').focus();
  }catch(e){ avviso('#avviso-accesso', e.message); }
  $('#chiedi').disabled = false;
};

$('#indietro').onclick = () => {
  $('#passo-codice').classList.add('nascosto');
  $('#passo-email').classList.remove('nascosto');
  avviso('#avviso-accesso','');
};
$('#rinvia').onclick = () => { $('#chiedi').click(); };

$('#entra').onclick = async () => {
  const email = $('#dove').textContent, token = $('#codice').value.replace(/\D/g,'');
  if(token.length < 4) return avviso('#avviso-accesso','Inserisci il codice che hai ricevuto.');
  $('#entra').disabled = true; avviso('#avviso-accesso','Verifico…','ok');
  try{
    salvaSessione(await verificaCodice(email, token));
    await entra();
  }catch(e){ avviso('#avviso-accesso', e.message); }
  $('#entra').disabled = false;
};
$('#codice').addEventListener('keydown', e => { if(e.key==='Enter') $('#entra').click(); });
$('#email').addEventListener('keydown', e => { if(e.key==='Enter') $('#chiedi').click(); });

async function entra(){
  try{
    io = await api('/login', { method:'POST', body:'{}' });
  }catch(e){
    scordaSessione();
    return avviso('#avviso-accesso', e.message);
  }
  $('#accesso').classList.add('nascosto');
  $('#app').classList.remove('nascosto');
  $('#chi').textContent = io.nome + (io.ruolo === 'admin' ? ' · amministratore'
                          : io.linea_migasender ? ' · linea ' + io.linea_migasender : '');
  ESITI.forEach(s => $('#f-stato').insertAdjacentHTML('beforeend', `<option>${esc(s)}</option>`));
  capacitaOra = { capacita: io.capacita, invio_automatico: io.invio_automatico, motivo: io.motivo };
  popolaOperatori();
  await Promise.all([caricaCoda(true), caricaKpi(), caricaDaMandare()]);
}

/* L'elenco arriva da /login. Si accorpano gli omonimi: in `operatori` la stessa
   persona può comparire due volte se ha due indirizzi email, ma per chi lavora
   è una sola riga, e l'identificativo buono è il proprio quando c'è.         */
function operatoriAttivi(){
  const visti = new Map();
  for(const o of (io?.operatori || [])){
    const chiave = (o.nome || '').trim().toLowerCase();
    if(!visti.has(chiave) || o.id === io.operatore_id) visti.set(chiave, o);
  }
  return [...visti.values()];
}

function popolaOperatori(){
  const sel = $('#f-operatore');
  sel.innerHTML = '<option value="tutti">TUTTI</option>'
    + operatoriAttivi().map(o => `<option value="${esc(o.id)}">${esc(o.nome)}</option>`).join('')
    + '<option value="nessuno">Ancora da assegnare</option>';
  /* si parte dalla propria coda, che è la cosa che serve appena si entra */
  sel.value = [...sel.options].some(o => o.value === io.operatore_id) ? io.operatore_id : 'tutti';
}

/* Elenco per le tendine dentro la scheda, dove serve anche «nessuno». */
function opzioniOperatore(selezionato){
  return '<option value="">— nessuno —</option>' + operatoriAttivi().map(o =>
    `<option value="${esc(o.id)}"${o.id === selezionato ? ' selected' : ''}>${esc(o.nome)}</option>`).join('');
}

function esci(){ scordaSessione(); location.reload(); }
$('#esci').onclick = esci;

/* ═══════════════ coda ═══════════════ */
function classeUrgenza(u){
  if(!u) return '';
  if(/scadut|ritard/i.test(u)) return 'u-scaduto';
  if(/oggi/i.test(u))          return 'u-oggi';
  if(/settimana/i.test(u))     return 'u-settimana';
  if(/chius|acquist|positiv/i.test(u)) return 'u-chiuso';
  return '';
}

async function caricaCoda(azzera = false){
  if(azzera) pagina = 0;
  const p = new URLSearchParams({ limite:'50', scarto:String(pagina*50) });
  if($('#cerca').value.trim()) p.set('ricerca', $('#cerca').value.trim());
  if($('#f-fascia').value)     p.set('fascia',  $('#f-fascia').value);
  if($('#f-urgenza').value)    p.set('urgenza', $('#f-urgenza').value);
  if($('#f-stato').value)      p.set('stato',   $('#f-stato').value);

  /* Quando guardi la tua coda vedi anche i contatti ancora liberi: senza questo,
     il primo giorno la coda sarebbe vuota per tutti, perché un contatto risulta
     assegnato solo dal momento in cui qualcuno apre la sua prima chiamata.    */
  const chi = $('#f-operatore').value || 'tutti';
  const anchLiberi = chi === io?.operatore_id;
  if(chi !== 'tutti'){ p.set('operatore', chi); if(anchLiberi) p.set('liberi','1'); }

  try{
    const d = await api('/coda?' + p);
    ultimoTotale = d.totale;
    if(azzera){
      $('#lista').innerHTML = '';
      const viste = new Set([...$('#f-fascia').options].map(o=>o.value));
      d.righe.forEach(r => { if(r.fascia && !viste.has(r.fascia)){
        viste.add(r.fascia);
        $('#f-fascia').insertAdjacentHTML('beforeend', `<option>${esc(r.fascia)}</option>`);
      }});
    }
    $('#conteggio').textContent =
      `${d.totale.toLocaleString('it-IT')} contatti in coda${anchLiberi ? ' (i tuoi più quelli ancora liberi)' : ''}`
      + ` · mostrati ${Math.min((pagina+1)*50, d.totale)} · ${d.ms} ms`;
    $('#lista').insertAdjacentHTML('beforeend', d.righe.map(riga).join(''));
    $('#altri').style.display = (pagina+1)*50 >= d.totale ? 'none' : '';
  }catch(e){ $('#conteggio').textContent = 'Errore: ' + e.message; }
}

function riga(r){
  const atti = (r.atto1 ? '🖥️' : '') + (r.atto2 ? '🤝' : '');
  return `<div class="riga ${classeUrgenza(r.urgenza)}" data-id="${r.id}">
    <div>
      <div class="chi-nome">${esc([r.nome,r.cognome].filter(Boolean).join(' ')) || '(senza nome)'}
        <span class="atti">${atti}</span>
        ${r.crm_consulente ? `<span class="pill crm">CRM · ${esc(r.crm_consulente)}</span>` : ''}
        ${(r.profilato_ora ?? r.profilato) ? '<span class="pill">profilato</span>' : ''}
        <span class="pill ${obiettivoPer(r)==='profilazione'?'cta-prof':'cta-forum'}">${obiettivoPer(r)==='profilazione'?'profilazione':'Forum'}</span>
        ${r.pronto_per_forum ? '<span class="pill maturo">pronto</span>' : ''}</div>
      <div class="meta">${esc(r.telefono || '—')} · ${esc(r.fascia || '')}${r.azienda ? ' · ' + esc(r.azienda) : ''}</div>
    </div>
    <div class="destra">
      <div><b>${esc(r.ultimo_esito || 'Da Contattare')}</b></div>
      <div>${r.n_chiamate ? r.n_chiamate + ' tentativi' : 'mai chiamato'}</div>
      <div>${etichettaAssegnato(r)}</div>
    </div>
  </div>`;
}

/* Chi ha in carico il contatto: si vede nella riga e nella scheda, così non
   serve aprire nulla per sapere se è tuo, di un'altra o ancora di nessuno.   */
function etichettaAssegnato(r){
  if(!r.operatore_assegnato) return '<span class="pill libero">libero</span>';
  const mio = r.operatore_assegnato === io?.operatore_id;
  return `<span class="pill ${mio ? 'mio' : ''}">${mio ? 'tuo' : esc(r.operatore_assegnato_nome || 'assegnato')}</span>`;
}

$('#lista').addEventListener('click', e => {
  const r = e.target.closest('.riga');
  if(r) apriScheda(Number(r.dataset.id));
});
$('#altri').onclick = () => { pagina++; caricaCoda(false); };
$('#ricarica').onclick = () => caricaCoda(true);
$('#f-fascia').onchange = $('#f-urgenza').onchange = $('#f-stato').onchange =
  $('#f-operatore').onchange = () => caricaCoda(true);
let attesa; $('#cerca').oninput = () => { clearTimeout(attesa); attesa = setTimeout(()=>caricaCoda(true), 300); };

/* ═══════════════ KPI ═══════════════ */
async function caricaKpi(){
  try{
    const d = await api('/kpi');
    const oggi = (d.operatore || []).filter(x => (x.giorno || '').slice(0,10) === new Date().toISOString().slice(0,10));
    const somma = c => oggi.reduce((t,x) => t + Number(x[c] || 0), 0);
    const fatte = somma('chiamate'), connesse = somma('connesse'), chiuse = somma('chiuse');
    $('#kpi').innerHTML = `
      <div><b>${fatte}</b><small>chiamate</small></div>
      <div><b>${connesse}</b><small>risposte</small></div>
      <div><b>${chiuse}</b><small>chiuse</small></div>
      <div><b>${ultimoTotale.toLocaleString('it-IT')}</b><small>in coda</small></div>`;
  }catch(e){ $('#kpi').innerHTML = `<div class="chi">KPI non disponibili</div>`; }
}

/* ═══════════════ scheda contatto ═══════════════ */
async function apriScheda(id){
  let d;
  try{ d = await api('/contatto/' + id); }
  catch(e){ return alert(e.message); }
  const c = d.contatto, storico = d.chiamate || [];
  const msg = componiMessaggio(c);
  const obiettivo = obiettivoPer(c);
  /* la capacità si rilegge all'apertura della scheda: fra una chiamata e
     l'altra il tetto orario può essersi chiuso */
  api('/capacita').then(r => { capacitaOra = r; }).catch(()=>{});

  /* Chi hai davanti, detto prima di tutto il resto: ruolo, settore, azienda.
     Arrivano vivi da PROD, quindi chi completa il profilo oggi se li ritrova in
     scheda alla chiamata dopo. Se non c'e' niente la riga sparisce: una riga di
     trattini non dice niente e ruba spazio a quello che conta. */
  const tratti = [c.ruolo, c.settore, c.azienda]
    .map(x => (x || '').trim()).filter(Boolean);

  const velo = document.createElement('div');
  velo.className = 'velo';
  velo.innerHTML = `
   <div class="scheda">
    <header>
      <span class="marchio">${esc([c.nome,c.cognome].filter(Boolean).join(' ')) || '(senza nome)'}</span>
      <span class="chi">${esc(c.telefono || 'nessun telefono')}</span>
      <span class="chi" data-intestazione-assegnato>${etichettaAssegnato(c)}</span>
      <button class="btn" style="width:auto;padding:6px 12px;margin-left:auto;background:#3A3168" data-chiudi>Chiudi</button>
    </header>
    <div class="corpo">

      <div class="recap">
        ${tratti.length ? `<div class="tratti">${tratti.map(esc).join(' · ')}</div>` : ''}
        <div><b>${esc(c.fascia || '')}</b> · priorità ${c.priorita ?? '—'} ·
             ${(c.fonti||[]).length} font${(c.fonti||[]).length===1?'e':'i'}
             ${c.atto1?' · 🖥️ Atto 1':''}${c.atto2?' · 🤝 Atto 2':''}
             ${(c.profilato_ora ?? c.profilato)?' · profilato su MigaMATCH':''}
             <span class="pill ${obiettivo==='profilazione'?'cta-prof':'cta-forum'}">${obiettivo==='profilazione'?'CTA: profilazione':'CTA: Forum'}</span>
             ${c.pronto_per_forum?'<span class="pill maturo">pronto per il Forum</span>':''}</div>
        <div style="margin-top:5px">${obiettivo==='profilazione'
           ? 'Da questa chiamata devi portare a casa <b>la data entro cui si profila</b>.'
           : 'Da questa chiamata devi portare a casa <b>la data in cui vi risentite per il biglietto</b>.'}</div>
        ${c.promessa_aperta ? `<div style="margin-top:5px">Ha promesso di profilarsi entro
           <b>${esc(dataImpegno(c) || 'una data che non è stata segnata')}</b>${promessaScaduta(c)
             ? ' — <b>la data è passata</b> e il profilo non risulta ancora completato: è questo il motivo della chiamata.'
             : '. Se nel frattempo lo completa, sparisce da qui da solo e torna fra sette giorni per il feedback.'}</div>`:''}
        ${c.pronto_per_forum ? `<div style="margin-top:5px">Si è profilato
           ${c.profilato_il ? 'il ' + dataOra(c.profilato_il) : ''} dopo una nostra chiamata, e sono passati
           più di sette giorni: è il momento del feedback e della proposta per il Forum.
           L'esito da usare è <b>Profilato - Call back</b>.</div>`:''}
        ${c.crm_consulente ? `<div style="margin-top:5px">In trattativa CRM (<b>${esc(c.crm_stage||'')}</b>) seguita da
             <b>${esc(c.crm_consulente)}</b>${c.crm_consulente===io.nome?' — sei tu':' — coordinati prima di chiamare'}.</div>`:''}
        <div style="margin-top:5px">${c.n_chiamate||0} tentativi · ultimo esito <b>${esc(c.ultimo_esito||'Da Contattare')}</b>
             ${c.ultima_chiamata_il?' il '+dataOra(c.ultima_chiamata_il):''}</div>
        ${d.ultima_nota ? `<div style="margin-top:5px;color:var(--tenue)">Ultima nota: “${esc(d.ultima_nota.testo)}”</div>`:''}
        ${c.note_origine ? `<div style="margin-top:5px;color:var(--tenue)">Storico: ${esc(c.note_origine)}</div>`:''}
        <div style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span>In carico a</span>
          <select class="campo" style="width:auto;margin:0" data-assegna>${opzioniOperatore(c.operatore_assegnato)}</select>
          <span data-esito-assegna style="color:var(--tenue)"></span>
        </div>
      </div>

      <div class="passi" data-passi><h4>La chiamata, passo per passo</h4>
        <div style="color:var(--tenue)">Carico lo script…</div></div>

      <div class="azioni">
        <button class="btn oro" data-avvia>Avvia chiamata</button>
        <span class="cronometro" data-crono>08:00</span>
        ${TERMINALI.has(c.ultimo_esito || '') ? ''
          : `<button class="btn" data-nonrisponde ${c.telefono?'':'disabled'}>${esc(etichettaNonRisponde(c))}</button>`}
        <button class="btn verde" data-wa ${c.telefono?'':'disabled'}>${esc(etichettaMessaggio(msg))}</button>
        <button class="btn ${c.promesso_non_pagato||c.acquirente?'oro':''}" data-email ${c.email?'':'disabled'}>${
          c.acquirente ? 'Email · benvenuto' : (c.promesso_non_pagato?'Email · riassunto e offerta':'Email')}</button>
        ${ripristinabile(c) ? '<button class="btn" data-ripristina>Rimetti in Da Contattare</button>' : ''}
      </div>

      <div data-form class="nascosto">
        <div class="griglia">
          <div>
            <label>Esito</label>
            <select class="campo" data-esito>${ESITI.map(s=>`<option>${esc(s)}</option>`).join('')}</select>
          </div>
          <div>
            <label>Obiezione principale</label>
            <select class="campo" data-obiezione><option value="">—</option>
              ${OBIEZIONI.map(o=>`<option>${esc(o)}</option>`).join('')}</select>
          </div>
          <div class="${obiettivo==='forum'?'campo-chiave':'secondario'}">
            <label>Data di ricontatto</label>
            <input class="campo" type="datetime-local" data-ricontatto>
            ${obiettivo==='forum'?'<div class="serve">È questa che devi portare a casa</div>':''}
          </div>
          <div class="${obiettivo==='profilazione'?'campo-chiave':'secondario'}">
            <label>Profilazione promessa entro</label>
            <input class="campo" type="date" data-profilazione>
            ${obiettivo==='profilazione'?'<div class="serve">È questa che devi portare a casa</div>':''}
          </div>
        </div>
        <label>Note sulla chiamata</label>
        <textarea data-note placeholder="Com'è andata: cosa ha detto, cosa serve ricordare la prossima volta…"></textarea>
        <p class="contatore" data-contatore>0 caratteri</p>
        <button class="btn oro" data-salva>Registra la chiamata</button>
        <div data-avviso-scheda></div>
      </div>

      ${storico.length ? `<h3 style="font-size:.9rem;margin:20px 0 8px;color:var(--tenue)">Storico</h3>
        ${storico.map(s=>`<div style="border-top:1px solid var(--bordo);padding:7px 0;font-size:.86rem">
          <b>${esc(s.esito||'—')}</b> · ${dataOra(s.iniziata_il)} · ${esc(s.operatore||'')}
          ${s.durata_secondi?` · ${Math.round(s.durata_secondi/60)} min`:''}
          ${s.note?`<div style="color:var(--tenue)">${esc(s.note)}</div>`:''}</div>`).join('')}`:''}
    </div>
   </div>`;
  document.body.appendChild(velo);

  const q = s => velo.querySelector(s);
  let chiamataId = null, partita = null;

  /* Gli step arrivano dopo, senza far aspettare la scheda: quello che serve per
     iniziare — chi e', cosa devi portare a casa — e' gia' a video. Se lo script
     non si carica la chiamata si fa lo stesso, e il riquadro lo dice invece di
     restare su «carico» per sempre. */
  caricaScript(scriptPer(c))
    .then(s => { if(q('[data-passi]')) disegnaPassi(q('[data-passi]'), s, c); })
    .catch(e => { if(q('[data-passi]')) q('[data-passi]').innerHTML =
      `<h4>La chiamata, passo per passo</h4><div class="nota-riga attenzione">Non sono riuscita a
       caricare lo script (${esc(e.message)}). La traccia e' nel Word, la chiamata si fa lo stesso.</div>`; });

  const chiudi = () => { if(cronometro) clearInterval(cronometro); cronometro = null; velo.remove(); };
  q('[data-chiudi]').onclick = chiudi;
  velo.addEventListener('click', e => { if(e.target === velo) chiudi(); });

  /* avvio: registra l'inizio e fa partire il conto alla rovescia degli 8 minuti.
     Erano 5, ma cinque minuti obbligano ad andare al dunque appena aperta la
     telefonata: e' la ragione per cui gli script suonavano forzati. */
  q('[data-avvia]').onclick = async () => {
    q('[data-avvia]').disabled = true;
    try{
      const r = await api('/chiamata', { method:'POST',
        body: JSON.stringify({ contatto_id: c.id, brand: marchioPer(c) }) });
      chiamataId = r.chiamata.id; partita = Date.now();
      q('[data-form]').classList.remove('nascosto');
      let resto = 480;
      cronometro = setInterval(() => {
        resto--;
        const m = String(Math.floor(Math.abs(resto)/60)).padStart(2,'0'),
              s = String(Math.abs(resto)%60).padStart(2,'0');
        const el = q('[data-crono]');
        el.textContent = (resto < 0 ? '+' : '') + m + ':' + s;
        el.classList.toggle('allarme', resto <= 30);
      }, 1000);
    }catch(e){ alert(e.message); q('[data-avvia]').disabled = false; }
  };

  /* la nota diventa obbligatoria solo se la chiamata ha ricevuto risposta */
  const aggiornaContatore = () => {
    const n = q('[data-note]').value.trim().length;
    const serve = CONNESSI.has(q('[data-esito]').value);
    const el = q('[data-contatore]');
    el.textContent = serve ? `${n} caratteri — minimo 20 perché la chiamata ha avuto risposta` : `${n} caratteri`;
    el.classList.toggle('corto', serve && n < 20);
  };
  q('[data-note]').oninput = aggiornaContatore;
  q('[data-esito]').onchange = aggiornaContatore;

  /* chi è maturo per il Forum ha già l'esito giusto pronto nel menu */
  if(c.pronto_per_forum) q('[data-esito]').value = 'Profilato - Call back';
  aggiornaContatore();

  q('[data-salva]').onclick = async () => {
    const esito = q('[data-esito]').value, note = q('[data-note]').value.trim();
    if(CONNESSI.has(esito) && note.length < 20)
      return avviso('[data-avviso-scheda]','Con questo esito la nota è obbligatoria: servono almeno 20 caratteri.');
    /* «Ricontatto» e «Profilato - Call back» sono impegni con una data: senza,
       il contatto sparirebbe in fondo alla coda invece di tornare quando serve. */
    if((esito === 'Ricontatto' || esito === 'Profilato - Call back') && !q('[data-ricontatto]').value)
      return avviso('[data-avviso-scheda]','Con questo esito serve la data di ricontatto: è l\'impegno che hai preso al telefono.');
    /* «Promette Profilazione» è la stessa cosa, ma la data che conta è l'altra:
       è quella che hai fatto dire a lui, ed è quella che finisce nel messaggio
       di recap. Senza, la promessa non scade mai e nessuno lo richiama. */
    if(esito === 'Promette Profilazione' && !q('[data-profilazione]').value)
      return avviso('[data-avviso-scheda]','Con questo esito serve la data entro cui si profila: è la promessa che ti ha fatto al telefono.');
    /* La cancellazione non si annulla dalla pagina: il contatto esce dalla lista
       e non ci rientra. Meglio una domanda in più che una persona tolta per
       errore — o una che ha chiesto di sparire e continua a ricevere chiamate. */
    if(esito === 'Richiede disiscrizione' && !confirm(
        `${(c.nome||'Questo contatto').trim()} ha chiesto di essere cancellato.\n\n`
      + `OK — esce dalla lista e non ci rientra piu'.\n`
      + `Annulla — torno indietro.\n\n`
      + `Se voleva solo dire che non gli interessa, usa «Non interessato».`)) {
      return;
    }
    q('[data-salva]').disabled = true;
    const corpo = {
      esito, note: note || null,
      obiezione: q('[data-obiezione]').value || null,
      durata_secondi: partita ? Math.round((Date.now()-partita)/1000) : null,
      ricontatto_il: q('[data-ricontatto]').value ? new Date(q('[data-ricontatto]').value).toISOString() : null,
      profilazione_promessa_il: q('[data-profilazione]').value || null
    };
    try{
      await api('/chiamata/' + chiamataId, { method:'PATCH', body: JSON.stringify(corpo) });
      chiudi(); await Promise.all([caricaCoda(true), caricaKpi()]);
    }catch(e){
      avviso('[data-avviso-scheda]', e.message);
      q('[data-salva]').disabled = false;
    }
  };

  /* ---- riassegnazione: il contatto passa nella coda dell'altra persona ---- */
  q('[data-assegna]').onchange = async (e) => {
    const a = e.target.value || null;
    e.target.disabled = true;
    q('[data-esito-assegna]').textContent = 'sposto…';
    try{
      await api('/assegna', { method:'POST', body: JSON.stringify({ contatto_id: c.id, operatore_id: a }) });
      c.operatore_assegnato = a;
      c.operatore_assegnato_nome = a ? (operatoriAttivi().find(o => o.id === a)?.nome ?? null) : null;
      q('[data-intestazione-assegnato]').innerHTML = etichettaAssegnato(c);
      q('[data-esito-assegna]').textContent = a ? 'spostato nella sua coda' : 'rimesso fra i liberi';
      caricaCoda(true);
    }catch(err){ q('[data-esito-assegna]').textContent = err.message; }
    e.target.disabled = false;
  };

  /* ---- il tentativo a vuoto, in un colpo solo ----
     Apre e chiude la chiamata senza passare dal modulo: nessuna nota da
     scrivere, perché la chiamata non ha ricevuto risposta. `connessa: false`
     va detto esplicitamente, altrimenti il database considera «Richiamata»
     una chiamata connessa e pretende venti caratteri di nota.
     Il messaggio si compone PRIMA di registrare: dopo, lo stato è cambiato
     e verrebbe fuori il messaggio del giro successivo.                      */
  if(q('[data-nonrisponde]')) q('[data-nonrisponde]').onclick = async () => {
    const bottone = q('[data-nonrisponde]');
    const secondo = (c.ultimo_esito || 'Da Contattare') === 'Richiamata';
    const m = componiMessaggio(c);
    const quando = secondo ? null : prossimoGiornoLavorativo();
    /* La domanda prima di tutto: segnare «non risponde» a chi non ha ancora
       ricevuto niente lo toglie dalla coda di oggi senza che gli sia arrivato
       un solo messaggio. Se la risposta e' no, qui non succede niente e i due
       pulsanti per mandarli sono li' accanto. */
    const chi = (c.nome || '').trim() || 'questo contatto';
    const conseguenza = secondo
      ? 'il contatto si chiude con «Non risponde»'
      : `il contatto passa in «Richiamata» per ${quando.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})}`;
    if(!confirm(`Hai gia' mandato il WhatsApp e l'email a ${chi}?\n\n`
      + `OK — si': ${conseguenza}.\n`
      + `Annulla — no: non segno niente, cosi' li mandi adesso.`)) return;

    bottone.disabled = true;
    try{
      let id = chiamataId;
      if(!id){
        const r = await api('/chiamata', { method:'POST',
          body: JSON.stringify({ contatto_id: c.id, brand: marchioPer(c) }) });
        id = r.chiamata.id;
      }
      await api('/chiamata/' + id, { method:'PATCH', body: JSON.stringify({
        esito: secondo ? 'Non risponde' : 'Richiamata',
        connessa: false,
        durata_secondi: partita ? Math.round((Date.now()-partita)/1000) : 0,
        ricontatto_il: quando ? quando.toISOString() : null
      })});
      /* il tentativo è registrato: ora si apre il messaggio già composto sullo
         stato di prima, e l'operatrice decide se e come mandarlo */
      apriComposizione(c, 'whatsapp', id, () => {
        chiudi(); caricaCoda(true); caricaKpi();
      }, { messaggio: m });
    }catch(e){ alert(e.message); bottone.disabled = false; }
  };

  /* ---- ripristino ----
     Non si cancella niente: si registra una nuova chiamata con esito
     «Da Contattare». La vista guarda solo l'ultima, quindi il contatto torna
     in coda, e nello storico resta scritto che c'è stato un ripristino.     */
  if(q('[data-ripristina]')) q('[data-ripristina]').onclick = async () => {
    if(!confirm(`Rimetto ${c.nome||'il contatto'} fra quelli da contattare? Lo storico delle chiamate resta.`)) return;
    q('[data-ripristina]').disabled = true;
    try{
      const r = await api('/chiamata', { method:'POST',
        body: JSON.stringify({ contatto_id: c.id, brand: marchioPer(c) }) });
      await api('/chiamata/' + r.chiamata.id, { method:'PATCH', body: JSON.stringify({
        esito: 'Da Contattare', connessa: false, durata_secondi: 0,
        note: `Rimesso in coda da ${io.nome}: si riparte da «${c.ultimo_esito}».`
      })});
      chiudi(); await Promise.all([caricaCoda(true), caricaKpi()]);
    }catch(e){ alert(e.message); q('[data-ripristina]').disabled = false; }
  };

  /* ---- WhatsApp ed email: si apre il popup, non si spara il messaggio ---- */
  q('[data-wa]').onclick    = () => apriComposizione(c, 'whatsapp', chiamataId);
  q('[data-email]').onclick = () => apriComposizione(c, 'email', chiamataId);
}

/* Il bottone rapido dice già cosa succede: al primo buco si richiama domani,
   al secondo si chiude. */
function etichettaNonRisponde(c){
  if((c.ultimo_esito || 'Da Contattare') === 'Richiamata') return 'Non risponde · chiudi';
  const g = prossimoGiornoLavorativo();
  return 'Non risponde · richiamo ' + g.toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'});
}

/* Si ripristina solo ciò che non è chiuso davvero, e che non è già in coda. */
function ripristinabile(c){
  const e = c.ultimo_esito || 'Da Contattare';
  return e !== 'Da Contattare' && !TERMINALI.has(e);
}

/* il marchio con cui ci si presenta cambia con la provenienza del contatto */
function marchioPer(c){
  const f = c.fonti || [];
  if(f.some(x => String(x).startsWith('bigbang'))) return 'MigaMATCH';
  return 'Segnalazione Vincente';
}

/* ═══════════════ flusso richiamata e testi ═══════════════
   Due tentativi a vuoto, due messaggi diversi.

   1º tentativo a vuoto → si manda il WA n.1 e il contatto passa in «Richiamata»
      con ricontatto_il al primo giorno lavorativo successivo: il giorno dopo si
      ritrova in cima alla coda, perché la vista ordina per urgenza.
   2º tentativo a vuoto → il contatto si chiude con «Non risponde» e parte il
      WA n.2, che cambia secondo l'obiettivo della fascia:
        · PROFILAZIONE per i BigBang non profilati (la fase di agosto)
        · FORUM       per tutte le altre fasce
   Da uno stato non terminale si può sempre tornare a «Da Contattare»
   registrando una nuova chiamata: lo storico non si cancella mai.            */

/* Il giorno lavorativo successivo, alle 9 del mattino: sabato e domenica si saltano. */
function prossimoGiornoLavorativo(da){
  const d = new Date(da || Date.now());
  d.setDate(d.getDate() + 1);
  while(d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);
  d.setHours(9, 0, 0, 0);
  return d;
}

/* L'obiettivo della telefonata lo dice il database, non la fascia.
   `cta` si ricalcola a ogni lettura guardando se la persona ha completato
   l'onboarding su MigaMATCH: chi si profila passa da PROFILAZIONE a FORUM da
   solo, senza che nessuno tocchi niente. La fascia resta ferma a com'era ad
   agosto, quindi dedurre da lì darebbe la risposta sbagliata il giorno dopo.  */
/* ═══════════════ gli script di chiamata ═══════════════
   Il testo non vive in questa pagina: sta nella Edge Function, perche' questo
   repo e' pubblico e la traccia di vendita non ha motivo di esserci dentro.
   Qui si sceglie solo quale dei sei serve, e si mostra.

   La scelta guarda prima l'obiettivo e poi la provenienza, in quest'ordine:
   chi non e' profilato va allo script della profilazione qualunque sia la sua
   storia, perche' in questa fase e' quello l'obiettivo. Gli altri si dividono
   per quanto ci conoscono: chi e' stato a un Forum dal vivo e' il segnale piu'
   forte e vince sugli altri.                                                 */
const SCRIPT_PER_FONTE = [
  [f => f.some(x => x.startsWith('forum_')), '03'],
  [f => f.includes('speed_presente'),        '04'],
  [f => f.includes('speed_iscritto'),        '05'],
  [f => f.includes('bigbang_profilato'),     '02']
];

function scriptPer(c){
  if(c.acquirente) return '06';
  if(obiettivoPer(c) === 'profilazione') return '01';
  const fonti = (c.fonti || []).map(String);
  for(const [prova, numero] of SCRIPT_PER_FONTE) if(prova(fonti)) return numero;
  return '02';
}

/* Gli script si scaricano una volta sola per sessione: sono gli stessi per
   tutti i contatti della stessa fascia e non cambiano durante il turno. */
const SCRIPT_IN_CACHE = {};
async function caricaScript(numero){
  if(!SCRIPT_IN_CACHE[numero]) SCRIPT_IN_CACHE[numero] = (await api('/script/' + numero)).script;
  return SCRIPT_IN_CACHE[numero];
}

/* I segnaposto riempiti con quello che sappiamo di questa persona: l'operatrice
   non deve tradurre niente mentre ha qualcuno al telefono. Quello che non
   sappiamo resta fra parentesi quadre, visibile, invece di sparire. */
function personalizza(testo, c){
  return String(testo)
    .replace(/\{BRAND\}/g, marchioPer(c))
    .replace(/\[NOME\]/g, (c.nome || '').trim() || '[NOME]')
    .replace(/\[OPERATRICE\]/g, (io && io.nome ? io.nome : '').trim() || '[OPERATRICE]')
    .replace(/\[DATA\]/g, dataImpegno(c) || '[DATA]')
    .replace(/\[EDIZIONE\]/g, edizioneForum(c) || '[EDIZIONE]');
}

/* Le sezioni che cominciano con «Se » sono rami, non passi: si percorrono solo
   quando succede qualcosa. Distinguerle evita che sembri una scaletta di
   quindici cose da dire. */
const eRamo = titolo => /^(se |cosa non si fa|prima di comporre)/i.test(titolo.trim());

function disegnaPassi(dove, s, c){
  const passi = s.sezioni.map(sez => {
    const battuta = (sez.b || []).find(r => r[0] === 'say');
    const primo = battuta ? personalizza(battuta[1], c) : '';
    return { titolo: sez.h, battuta: primo, ramo: eRamo(sez.h) };
  });
  dove.innerHTML = `<h4>La chiamata, passo per passo — script ${esc(s.numero)} · ${esc(s.titolo)}</h4>
    <ol>${passi.map(p => `<li class="${p.ramo?'ramo':''}"><b>${esc(p.titolo)}</b>${
      p.battuta ? `<span>“${esc(p.battuta.length > 120 ? p.battuta.slice(0,120) + '…' : p.battuta)}”</span>` : ''
    }</li>`).join('')}</ol>
    <button class="btn apri" data-apri-script>Apri lo script completo</button>`;
  dove.querySelector('[data-apri-script]').onclick = () => mostraScript(s, c);
}

/* Lo script per intero, con i segnaposto gia' riempiti. */
function mostraScript(s, c){
  const velo = document.createElement('div');
  velo.className = 'velo';
  const riga = r => r[0] === 'say' ? `<p class="say">${esc(personalizza(r[1], c))}</p>`
              : r[0] === 'bul' ? `<p class="bul">• ${esc(personalizza(r[1], c))}</p>`
              : `<p class="nota">▸ ${esc(personalizza(r[1], c))}</p>`;
  velo.innerHTML = `
   <div class="scheda">
    <header>
      <span class="marchio">Script ${esc(s.numero)} · ${esc(s.titolo)}</span>
      <span class="chi">${esc(s.brand)}</span>
      <button class="btn" style="width:auto;padding:6px 12px;margin-left:auto;background:#3A3168" data-chiudi>Chiudi</button>
    </header>
    <div class="corpo">
      <div class="recap"><b>Obiettivo</b> — ${esc(s.obiettivo)}</div>
      <div class="testo-script">
        ${s.sezioni.map(sez => `<h3>${esc(sez.h)}</h3>${(sez.b||[]).map(riga).join('')}`).join('')}
        ${(s.obiezioni||[]).length ? `<h3>Se ti dice…</h3>${s.obiezioni.map(o =>
          `<div class="obz"><b>${esc(o[0])}</b><p class="say">${esc(personalizza(o[1], c))}</p></div>`).join('')}` : ''}
      </div>
    </div>
   </div>`;
  document.body.appendChild(velo);
  const chiudi = () => velo.remove();
  velo.querySelector('[data-chiudi]').onclick = chiudi;
  velo.addEventListener('click', e => { if(e.target === velo) chiudi(); });
}

function obiettivoPer(c){
  const cta = c.cta || (c.profilato_ora ?? c.profilato ? 'FORUM' : 'PROFILAZIONE');
  return cta === 'FORUM' ? 'forum' : 'profilazione';
}

   Quale sia dipende dalla CTA: chi deve profilarsi promette una data di
   profilazione, chi punta al Forum dà una data di ricontatto per decidere.

   Senza giorno della settimana, di proposito: nei messaggi la data sta sempre
   dopo un articolo — «entro il [DATA]», «fino al [DATA]» — e «entro il giovedì
   27 agosto» non è italiano. L'ora c'è quando c'è, perché la regola della
   campagna è dire giorno e ora, mai «48 ore».                                */
/* La promessa di profilarsi e' scaduta e il profilo non risulta completato.
   Il database la considera aperta finche' non si profila davvero: qui serve
   solo a dirlo in scheda con parole diverse da un generico «in ritardo». */
function promessaScaduta(c){
  if(!c.promessa_aperta || !c.profilazione_promessa_il) return false;
  return new Date(String(c.profilazione_promessa_il) + 'T18:00:00') < new Date();
}

function dataImpegno(c){
  if(obiettivoPer(c) === 'profilazione'){
    const g = c.profilazione_promessa_il;
    if(!g) return null;
    return new Date(String(g) + 'T12:00:00').toLocaleDateString('it-IT',
      {day:'numeric', month:'long'});
  }
  const t = c.ricontatto_il;
  if(!t) return null;
  const d = new Date(t);
  return d.toLocaleDateString('it-IT',{day:'numeric', month:'long'})
       + ' alle ' + d.toLocaleTimeString('it-IT',{hour:'2-digit', minute:'2-digit'});
}

   e qual è l'obiettivo della persona:

     ha risposto e ha preso un impegno  → il recap, con la data che ha dato
     non ha risposto ed è già in coda   → il n.2, con il regalo di Economy
     non ha risposto la prima volta     → il n.1, che annuncia il richiamo

   `mancano` elenca i segnaposto che non si è riusciti a riempire. Il popup lo
   legge e blocca l'invio: un messaggio con un buco è peggio di nessun messaggio.
   Il tipo serve a registrare l'invio, e il database ne ammette solo quattro:
   recap · promemoria · economy · benvenuto.                                  */
function componiMessaggio(c, operatore, opzioni){
  const o = opzioni || {};
  const nome = (c.nome || '').trim() || 'ciao';
  const op = (operatore ?? io?.nome ?? '').trim();
  const brand = marchioPer(c);
  const obiettivo = obiettivoPer(c);
  const esito = c.ultimo_esito || 'Da Contattare';

  let quale, tentativo = 0, tipo;
  /* chi ha gia' pagato viene prima di tutto: a lui non si vende piu' niente,
     gli si dice benvenuto e cosa fare adesso. */
  if(c.acquirente){ quale = 'benvenuto_acquisto'; tipo = 'benvenuto'; }
  /* chi ha detto «vengo» e non ha ancora pagato: via email va il riassunto
     lungo, quello che mette per iscritto evento, offerta e scadenza. */
  else if(o.canale === 'email' && c.promesso_non_pagato){ quale = 'email_promesso'; tipo = 'recap'; }
  else if(ANDATA_BENE.has(esito)){  quale = 'bene_' + obiettivo;      tipo = 'recap'; }
  else if(esito === 'Richiamata'){  quale = varianteSecondoBuco(c);   tipo = 'economy';    tentativo = 2; }
  else {                            quale = 'primo';                  tipo = 'promemoria'; tentativo = 1; }

  const pacchetto = o.pacchetto === 'azienda' ? 'azienda' : 'base';
  const data = dataImpegno(c);
  const prezzo = pacchetto === 'azienda' ? PACCHETTI.azienda.prezzo : prezzoDelGiorno();
  const edizione = edizioneForum(c);

  const mancano = [];
  if(quale.startsWith('bene_') && !data) mancano.push('data');
  if(quale === 'email_promesso' && !data) mancano.push('data');
  if((quale === 'bene_forum' || quale === 'email_promesso') && !prezzo) mancano.push('prezzo');
  if(quale === 'quattro_b' && !edizione) mancano.push('edizione');

  const p = { nome, op, edizione,
              brand: BRAND_VARIANTE[quale] ?? brand,
              data, prezzo, link: linkAcquisto(pacchetto),
              linkProfilo: LINK_PROFILO, linkGuida: LINK_GUIDA };
  const testo = TESTI[quale](p);
  const TITOLI = {
    primo: 'primo tentativo a vuoto',
    quattro_a: 'secondo tentativo a vuoto · profilo da completare',
    quattro_b: 'secondo tentativo a vuoto · è già stato a un Forum',
    quattro_c: 'secondo tentativo a vuoto · viene dagli Speed',
    bene_profilazione: 'recap dopo la chiamata · profilazione',
    bene_forum: 'recap dopo la chiamata · Forum',
    email_promesso: 'ha detto di venire e non ha ancora comprato',
    benvenuto_acquisto: 'ha comprato · benvenuto e istruzioni'
  };

  return {
    quale, obiettivo, tentativo, tipo, pacchetto, mancano, data, prezzo, edizione,
    titolo: TITOLI[quale],
    brand: p.brand,
    oggetto: OGGETTI[quale](nome),
    testo,
    /* nell'email il grassetto di WhatsApp non si vede: si toglie */
    testoEmail: testo.replace(/\*([^*\n]+)\*/g, '$1')
  };
}

/* Il perché il messaggio manca, detto all'operatrice come lo direbbe una persona. */
function perchePuoMancare(m){
  const q = [];
  if(m.mancano.includes('data'))
    q.push(m.obiettivo === 'profilazione'
      ? 'manca la data di profilazione promessa: registrala nella chiamata e torna qui'
      : 'manca la data di ricontatto: registrala nella chiamata e torna qui');
  if(m.mancano.includes('prezzo'))
    q.push('manca il prezzo di listino per oggi: il listino è confermato solo fino al 31 agosto, chiedi a Oscar prima di mandare');
  if(m.mancano.includes('edizione'))
    q.push('non risulta a quale Forum abbia partecipato: controlla le fonti del contatto');
  return q.join(' · ');
}

/* Etichetta del pulsante: dice quale messaggio sta per uscire. */
function etichettaMessaggio(m){
  if(m.quale === 'benvenuto_acquisto') return 'WhatsApp · benvenuto';
  if(m.quale.startsWith('bene_')) return 'WhatsApp · recap';
  return 'WhatsApp n.' + m.tentativo;
}

/* Anche quello che parte fuori dal sistema resta scritto: senza, nessuno
   saprebbe più chi ha ricevuto cosa.                                         */
/* `aMano` distingue l'invio partito da wa.me — o dal testo copiato e spedito
   dalla propria posta — da quello passato per la linea Migasender: nei
   conteggi devono esserci entrambi, ma solo il secondo consuma il tetto del
   provider. Se il messaggio esisteva già
   — è un promemoria che aspettava una mano — si aggiorna quella riga invece di
   crearne una seconda.                                                       */
async function registraMessaggio(c, m, canale, chiamataId, testo, aMano, messaggioId){
  const corpo = testo ?? (canale === 'email' ? m.testoEmail : m.testo);
  const finale = canale === 'email' ? (m.oggetto + '\n\n' + corpo) : corpo;
  try{
    if(messaggioId){
      await api('/messaggio/' + messaggioId, { method:'PATCH', body: JSON.stringify({ testo: finale }) });
    }else{
      await api('/messaggio', { method:'POST', body: JSON.stringify({
        contatto_id: c.id, tipo: m.tipo, canale,
        chiamata_id: chiamataId ?? null,
        a_mano: aMano === true,
        testo: finale
      })});
    }
  }catch(e){ console.warn('invio non registrato:', e.message); }
}

/* ═══════════════ popup di composizione ═══════════════
   Il pulsante non apre più wa.me di scatto: apre questo, dove il testo è
   modificabile. Quello che parte è quello che c'è nel campo, non il template:
   se l'operatrice adatta una frase, deve partire la sua.

   L'invio automatico passa dal server (linea Migasender dell'operatrice). Se le
   linee sono al limite o bloccate non si prova nemmeno: si apre già in modo
   manuale, spiegando perché. Il ripiego a mano resta comunque sempre
   disponibile, perché a volte serve e basta.                                  */
function apriComposizione(c, canale, chiamataId, dopo, opzioni){
  /* `opzioni.messaggio` serve quando l'esito è appena stato registrato: il testo
     è stato composto prima, sullo stato di allora, e ricomporlo adesso darebbe
     quello del giro successivo. `opzioni.messaggioId` è la riga già in attesa,
     quando si apre un promemoria rimasto da mandare a mano.                   */
  opzioni = opzioni || {};
  const m = opzioni.messaggio || componiMessaggio(c, undefined, { canale });
  const destinatario = canale === 'email' ? (c.email || '') : (c.telefono || '');
  const bloccato = m.mancano.length > 0;

  const velo = document.createElement('div');
  velo.className = 'velo';
  velo.style.zIndex = 60;
  velo.innerHTML = `
   <div class="composa">
    <header>
      <span class="marchio">${canale === 'email' ? 'EMAIL' : 'WHATSAPP'}</span>
      <span class="chi" data-quale></span>
      <button class="btn" style="width:auto;padding:6px 12px;margin-left:auto;background:#3A3168" data-chiudi>Chiudi</button>
    </header>
    <div class="corpo">
      <p class="a-chi">A <b>${esc([c.nome,c.cognome].filter(Boolean).join(' ')) || 'questo contatto'}</b>
         · ${esc(destinatario || 'nessun recapito')}</p>

      ${canale === 'email' ? `<label>Oggetto</label>
        <input class="campo" data-oggetto value="${esc(m.oggetto)}">` : ''}

      ${(m.quale === 'bene_forum' || m.quale === 'email_promesso') ? `<label>Cosa gli stai proponendo</label>
        <select class="campo" data-pacchetto>
          <option value="base">Biglietto base — prezzo del listino di oggi</option>
          <option value="azienda">Pacchetto azienda — 599 €</option>
        </select>` : ''}

      <label>Testo del messaggio</label>
      <textarea data-testo></textarea>

      <div data-motivo></div>

      <div class="azioni">
        <button class="btn oro" data-invia>${canale === 'email'
          ? ('Invia da ' + (io?.email_mittente || 'il tuo indirizzo'))
          : ('Invia dalla linea ' + (io?.linea_migasender ? io.linea_migasender : 'Migasender'))}</button>
        <button class="btn" data-mano>${canale === 'email' ? 'Copia il testo e segnalo inviato a mano' : 'Invia a mano con WhatsApp Web'}</button>
      </div>

      ${canale === 'email'
        ? `<p class="nota-riga">Parte da <b>${esc(io?.email_mittente || '—')}</b>, che gira sulla tua casella:
           se ti rispondono, la risposta arriva a te. Qui non ci sono tetti da rispettare, quelli valgono
           solo per WhatsApp.</p>`
        : `<p class="nota-riga">Mandandolo a mano parte dal tuo numero personale, non dalla
        linea Migasender: il contatto se lo vede arrivare da un numero diverso da quello che userebbe per
        risponderti, e la conversazione si divide su due numeri.</p>`}
      <div data-esito-invio></div>
    </div>
   </div>`;
  document.body.appendChild(velo);

  const q = s => velo.querySelector(s);
  const chiudi = () => velo.remove();
  q('[data-chiudi]').onclick = chiudi;
  velo.addEventListener('click', e => { if(e.target === velo) chiudi(); });

  /* ridisegna testo, etichette e blocchi: serve anche quando cambia il pacchetto */
  let corrente = m;
  function ridisegna(){
    q('[data-quale]').textContent = corrente.titolo ?? (corrente.quale.startsWith('bene_')
      ? 'recap dopo la chiamata · ' + corrente.obiettivo
      : `tentativo n.${corrente.tentativo} · ${corrente.obiettivo}`);
    q('[data-testo]').value = canale === 'email' ? corrente.testoEmail : corrente.testo;
    if(q('[data-oggetto]')) q('[data-oggetto]').value = corrente.oggetto;

    const manca = corrente.mancano.length > 0;
    q('[data-motivo]').innerHTML = manca
      ? `<p class="nota-riga blocco">Non posso mandarlo così — ${esc(perchePuoMancare(corrente))}.</p>`
      : (canale === 'whatsapp' && capacitaOra && !capacitaOra.invio_automatico
          ? `<p class="nota-riga attenzione">${esc(capacitaOra.motivo || 'Le linee non sono disponibili.')}
             Si manda a mano.</p>`
          : '');
    /* L'email non ha tetti da rispettare: quelli sono un limite delle linee
       Migasender, non di SendGrid. Se il testo e' completo, si manda e basta. */
    const autoOk = !manca && (canale === 'email' ? true : (capacitaOra ? capacitaOra.invio_automatico : true));
    q('[data-invia]').disabled = !autoOk;
    q('[data-mano]').disabled = manca;
  }
  ridisegna();

  if(q('[data-pacchetto]')) q('[data-pacchetto]').onchange = (e) => {
    corrente = componiMessaggio(c, undefined, { pacchetto: e.target.value, canale });
    ridisegna();
  };

  const testoScelto = () => q('[data-testo]').value.trim();

  /* invio dal server: il testo che parte è quello del campo */
  q('[data-invia]').onclick = async () => {
    const testo = testoScelto();
    if(!testo) return;
    q('[data-invia]').disabled = true;
    avviso('[data-esito-invio]', 'Invio in corso…', 'ok');
    try{
      const invio = { contatto_id: c.id, tipo: corrente.tipo, canale, testo,
                      chiamata_id: chiamataId ?? null };
      if(canale === 'email'){
        invio.oggetto = (q('[data-oggetto]') ? q('[data-oggetto]').value : corrente.oggetto).trim();
        if(!invio.oggetto){ q('[data-invia]').disabled = false;
          return avviso('[data-esito-invio]', 'Manca l\u2019oggetto: senza, la mail parte come "(nessun oggetto)".'); }
      }
      const r = await api('/invia', { method:'POST', body: JSON.stringify(invio) });
      if(r.inviato){
        avviso('[data-esito-invio]', (canale === 'email'
          ? 'Email inviata da ' + (io?.email_mittente || 'il tuo indirizzo') + '.'
          : 'Inviato dalla linea Migasender.') + (r.riferimento ? ' ' + r.riferimento : ''), 'ok');
        if(dopo) dopo();
        setTimeout(chiudi, 1200);
      }else{
        avviso('[data-esito-invio]', (r.motivo || 'Invio non riuscito.') + ' ' + (canale === 'email'
          ? 'Copia il testo qui sotto e mandalo dalla tua posta.'
          : 'Mandalo a mano qui sotto.'));
        q('[data-invia]').disabled = true;
      }
    }catch(e){
      avviso('[data-esito-invio]', e.message + ' ' + (canale === 'email'
        ? 'Copia il testo qui sotto e mandalo dalla tua posta.'
        : 'Mandalo a mano qui sotto.'));
      q('[data-invia]').disabled = true;
    }
  };

  /* ripiego manuale: si apre wa.me o il client di posta, e si registra lo stesso */
  q('[data-mano]').onclick = () => {
    const testo = testoScelto();
    if(!testo) return;
    if(canale === 'email'){
      const oggetto = q('[data-oggetto]') ? q('[data-oggetto]').value : corrente.oggetto;
      if(!c.email) return avviso('[data-esito-invio]', 'Questo contatto non ha un indirizzo email.');
      copiaNegliAppunti(`A: ${c.email}\nOggetto: ${oggetto}\n\n${testo}`);
    }else{
      const n = (c.telefono || '').replace(/\D/g,'');
      if(!n) return avviso('[data-esito-invio]', 'Questo contatto non ha un numero di telefono.');
      window.open(`https://wa.me/${n}?text=${encodeURIComponent(testo)}`, '_blank', 'noopener');
    }
    registraMessaggio(c, corrente, canale, chiamataId, testo, true, opzioni.messaggioId);
    avviso('[data-esito-invio]', canale === 'email'
      ? 'Testo copiato negli appunti e segnato come inviato a mano.'
      : 'Segnato come inviato a mano.', 'ok');
    if(dopo) dopo();
  };
}

/* ═══════════════ messaggi rimasti da mandare a mano ═══════════════
   Ci finiscono i promemoria che il cron della mattina non ha potuto spedire
   perché le linee Migasender erano al limite o bloccate, più tutto quello che
   è scaduto in coda. Il tetto vale solo per gli invii dal provider: mandati a
   mano non consumano niente, quindi qui non si perde niente — basta che
   qualcuno se ne accorga, ed è per questo che il pulsante sta in testata.    */
let daMandare = [];

async function caricaDaMandare(){
  try{
    const d = await api('/da-mandare');
    daMandare = d.righe || [];
  }catch(e){ daMandare = []; }
  const b = $('#da-mandare');
  b.textContent = daMandare.length + ' da mandare a mano';
  b.classList.toggle('nascosto', daMandare.length === 0);
}

function apriDaMandare(){
  if(daMandare.length === 0) return;
  const velo = document.createElement('div');
  velo.className = 'velo';
  velo.innerHTML = `
   <div class="scheda">
    <header>
      <span class="marchio">DA MANDARE A MANO</span>
      <span class="chi">${daMandare.length} messaggi</span>
      <button class="btn" style="width:auto;padding:6px 12px;margin-left:auto;background:#3A3168" data-chiudi>Chiudi</button>
    </header>
    <div class="corpo">
      <p class="nota-riga">Le linee Migasender erano al limite quando questi dovevano partire. Mandarli da
      WhatsApp Web non consuma il tetto, quindi si possono smaltire tutti — ma partono dal tuo numero
      personale, non dalla linea.</p>
      ${daMandare.map(m => `
        <div class="riga" data-messaggio="${m.id}" style="cursor:pointer">
          <div>
            <div class="chi-nome">${esc([m.nome,m.cognome].filter(Boolean).join(' ')) || '(senza nome)'}</div>
            <div class="meta">${esc(m.telefono || m.destinatario || '—')} · ${esc(m.tipo)}
              ${m.operatore ? ' · ' + esc(m.operatore) : ''}</div>
            ${m.errore ? `<div class="meta" style="color:var(--gold-dk)">${esc(m.errore)}</div>` : ''}
          </div>
          <div class="destra">${dataOra(m.creato_il)}</div>
        </div>`).join('')}
    </div>
   </div>`;
  document.body.appendChild(velo);
  const chiudi = () => velo.remove();
  velo.querySelector('[data-chiudi]').onclick = chiudi;
  velo.addEventListener('click', e => { if(e.target === velo) chiudi(); });

  velo.addEventListener('click', e => {
    const r = e.target.closest('[data-messaggio]');
    if(!r) return;
    const m = daMandare.find(x => String(x.id) === r.dataset.messaggio);
    if(!m) return;
    /* il testo è già quello scritto dal cron: non si ricompone, si riapre */
    apriComposizione(
      { id:m.contatto_id, nome:m.nome, cognome:m.cognome, telefono:m.telefono, email:m.email },
      m.canale || 'whatsapp', null,
      () => { caricaDaMandare().then(()=>{ chiudi(); }); },
      { messaggioId: m.id, messaggio: {
          quale:'in_attesa', titolo:'promemoria rimasto in sospeso', obiettivo:'', tentativo:0,
          tipo:m.tipo, mancano:[], oggetto:'Promemoria', testo:m.testo, testoEmail:m.testo } });
  });
}

$('#da-mandare').onclick = apriDaMandare;

/* ═══════════════ pausa ═══════════════ */
$('#pausa').onclick = async () => {
  const fino = prompt('Pausa fino a quando? (giorno e ora, es. 2026-08-21 09:00)');
  if(!fino) return;
  const quando = new Date(fino.replace(' ','T'));
  if(isNaN(quando)) return alert('Non ho capito la data.');
  const motivo = prompt('Motivo (facoltativo)') || null;
  try{
    await api('/pausa', { method:'POST',
      body: JSON.stringify({ inizio: new Date().toISOString(), fine: quando.toISOString(), motivo }) });
    alert('Pausa registrata. Le tue scadenze slittano di conseguenza.');
  }catch(e){ alert(e.message); }
};
